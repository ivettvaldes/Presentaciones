<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivette Valdes — Tarjeta de presentación</title>
<style>
  :root{
    --bg:            #0d0a14;
    --card:          #17111f;
    --card-edge:     #2a2038;
    --pink:          #ff2f92;
    --pink-soft:     #ff8ac4;
    --lilac:         #b98bff;
    --lilac-dim:     #6d4d9c;
    --mint:          #4dffb4;
    --ink:           #f1ecfb;
    --ink-dim:       #9c8fb8;
  }
 
  *{box-sizing:border-box;}
 
  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(185,139,255,0.14), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255,47,146,0.12), transparent 45%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
  }
 
  .card{
    position:relative;
    width:380px;
    max-width:100%;
    border-radius:14px;
    background:linear-gradient(160deg,var(--card) 0%, #100c19 100%);
    border:1px solid var(--card-edge);
    box-shadow:
      0 0 0 1px rgba(255,47,146,0.05),
      0 30px 60px -20px rgba(0,0,0,0.7),
      0 0 40px -10px rgba(185,139,255,0.15);
    overflow:hidden;
  }
 
  /* barra tipo editor de código */
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 14px;
    background:#120d1c;
    border-bottom:1px solid var(--card-edge);
  }
  .dot{width:9px;height:9px;border-radius:50%;}
  .dot.r{background:#ff5f56;}
  .dot.y{background:#ffbd2e;}
  .dot.g{background:#27c93f;}
  .filename{
    margin-left:8px;
    font-size:11.5px;
    color:var(--ink-dim);
    letter-spacing:.02em;
  }
  .filename b{color:var(--pink-soft); font-weight:500;}
 
  .body{
    padding:26px 26px 24px;
    position:relative;
  }
 
  /* kuromi svg, esquina superior derecha, sobre el titlebar */
  .kuromi{
    position:absolute;
    top:-14px;
    right:10px;
    width:82px;
    height:auto;
    display:block;
    filter:drop-shadow(0 6px 14px rgba(255,47,146,0.45));
  }
 
  .code-line{
    font-size:13px;
    line-height:1.85;
    white-space:pre;
  }
  .kw{color:var(--lilac);}
  .fn{color:var(--pink-soft);}
  .punc{color:var(--ink-dim);}
  .str{color:var(--mint);}
  .key{color:#8fd6ff;}
 
  .name{
    margin-top:14px;
    font-size:24px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:.01em;
  }
  .name .caret{
    display:inline-block;
    width:9px;height:20px;
    background:var(--pink);
    margin-left:4px;
    vertical-align:-3px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
 
  .role{
    margin-top:4px;
    font-size:12px;
    color:var(--lilac);
  }
 
  .divider{
    margin:18px 0;
    height:1px;
    background:linear-gradient(90deg, var(--pink) 0%, var(--lilac-dim) 40%, transparent 100%);
    opacity:.5;
  }
 
  .field{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:12.5px;
    margin-bottom:9px;
  }
  .field .label{color:var(--ink-dim);}
  .field .val{color:var(--ink); font-weight:500; letter-spacing:.02em;}
 
  .footer{
    margin-top:18px;
    padding-top:14px;
    border-top:1px dashed var(--card-edge);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .tag{
    font-size:10.5px;
    color:var(--ink-dim);
    letter-spacing:.02em;
  }
  .tag .heart{color:var(--pink);}
  .status{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:10.5px;
    color:var(--mint);
  }
  .status .pulse{
    width:6px;height:6px;border-radius:50%;
    background:var(--mint);
    box-shadow:0 0 0 0 rgba(77,255,180,.6);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(77,255,180,.55);}
    70%{box-shadow:0 0 0 6px rgba(77,255,180,0);}
    100%{box-shadow:0 0 0 0 rgba(77,255,180,0);}
  }
 
  @media (max-width:420px){
    .card{width:100%;}
    .name{font-size:21px;}
  }
</style>
</head>
