<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Presentacion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card" aria-label="Tarjeta de presentacion gamer pastel">
    <section class="banner">
      <div class="level">Presentation card Card</div>
      <div class="avatar" aria-hidden="true">BL</div>
    </section>

    <section class="content">
      <h1>Berakhah Efratah Lara Perez</h1>
      <p class="role"></p>
      <p class="bio">
        Creo experiencias digitales bonitas, claras y faciles de usar, con una vibra tierna de caricatura clasica.
      </p>

      <div class="stats" aria-label="Estadisticas de perfil">
        <div class="stat">
          <strong>98</strong>
          <span>Creatividad</span>
        </div>
        <div class="stat">
          <strong>91</strong>
          <span>Estilo</span>
        </div>
        <div class="stat">
          <strong>87</strong>
          <span>UX</span>
        </div>
      </div>

      <div class="info">
        <div class="info-item">
          <span class="icon">@</span>
          laraberakhah@gmail.com
        </div>
        <div class="info-item">
          <span class="icon">#</span>
          Ramos Arizpe, Coahuila, Mexico
        </div>
      </div>

      <div class="actions">
        <a class="button" href="mailto:laraberakhah@gmail.com">Contactar</a>
        <a class="button secondary" href="#">Portfolio</a>
      </div>
    </section>
  </main>
</body>
</html>
